name: lazyscan

# Postgres is the shared `shared-postgres` instance (external `shared-db` network),
# not a per-stack container. DATABASE_URL is fully env-driven so each environment
# points at its own database (prod: lazyscan, staging: lazyscan_staging).
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server","--save","60","1","--maxmemory","48mb","--maxmemory-policy","noeviction"]
    volumes: [redis-data:/data]
    mem_limit: 96m            # streams + cache + denylist; noeviction so stream entries aren't dropped

  image-svc:                  # ex-Kiln: consumes events:chapter-page + HTTP /convert
    build: ./image-svc
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_REGION: auto
      STORAGE_FORCE_PATH_STYLE: "true"
      STORAGE_PUBLIC_DOMAIN: ${STORAGE_PUBLIC_DOMAIN}
      IMAGE_SVC_PORT: 8001
    depends_on:
      redis: { condition: service_started }
    networks: [default, shared-db]
    mem_limit: 256m           # govips/libvips holds the decoded image in RAM
    restart: unless-stopped

  mail-svc:                   # ex-Herald: consumes events:email
    build: ./mail-svc
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_SSL: ${SMTP_SSL:-false}              # implicit TLS (SMTPS, port 465); mutually exclusive with STARTTLS
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    depends_on:
      redis: { condition: service_started }
    networks: [default, shared-db]
    mem_limit: 48m
    restart: unless-stopped

  api:
    build: ./api
    depends_on:
      redis: { condition: service_started }
      image-svc: { condition: service_started }
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}   # s3 profile reads STORAGE_*; default r2 reads CLOUDFLARE_* (unset here)
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_REGION: auto
      STORAGE_FORCE_PATH_STYLE: "true"
      STORAGE_PUBLIC_DOMAIN: ${STORAGE_PUBLIC_DOMAIN}
      IMAGE_SVC_URL: http://image-svc:8001     # avatars/covers sync convert
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-8589934592}   # 8 GiB (§8.3)
      ENABLE_STORAGE_PRUNE: ${ENABLE_STORAGE_PRUNE:-false}      # reclaim staged page originals under the cap
      ENABLE_RATE_LIMIT: ${ENABLE_RATE_LIMIT:-false}            # per-IP limiter (all routes + auth/public buckets)
      TRUST_PROXY: ${TRUST_PROXY:-false}                        # key on nginx X-Real-IP (from CF-Connecting-IP)
      JWT_SECRET: ${JWT_SECRET}
      DEFAULT_SUPERUSER_EMAIL: ${DEFAULT_SUPERUSER_EMAIL}
      DEFAULT_SUPERUSER_PASSWORD: ${DEFAULT_SUPERUSER_PASSWORD}
    networks: [default, shared-db]
    mem_limit: 256m
    restart: unless-stopped

  web:
    build: ./web                        # nginx: SPA + proxy /api
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]   # Cloudflare Tunnel → here; per-env WEB_PORT in .env (prod 8080, staging 8090)
    depends_on: [api]
    mem_limit: 48m
    restart: unless-stopped

networks:
  shared-db:                  # external: shared-postgres lives here (discord-bot instance)
    external: true

volumes:
  redis-data:
