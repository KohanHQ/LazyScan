name: lazyscan

services:
  image-svc:
    build: ./image-svc
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_REGION: auto
      STORAGE_FORCE_PATH_STYLE: "true"
      STORAGE_PUBLIC_DOMAIN: ${STORAGE_PUBLIC_DOMAIN}
      IMAGE_SVC_PORT: 8001
    networks: [default, shared-db]
    # govips/libvips holds the decoded image in RAM
    mem_limit: 256m           
    restart: unless-stopped

  mail-svc:
    build: ./mail-svc
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      # implicit TLS (SMTPS, port 465); mutually exclusive with STARTTLS
      SMTP_SSL: ${SMTP_SSL:-false}              
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    networks: [default, shared-db]
    mem_limit: 256m
    restart: unless-stopped

  api:
    build: ./api
    depends_on:
      image-svc: { condition: service_started }
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # s3 profile reads STORAGE_*; default r2 reads CLOUDFLARE_* (unset here)
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}   
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_REGION: auto
      STORAGE_FORCE_PATH_STYLE: "true"
      STORAGE_PUBLIC_DOMAIN: ${STORAGE_PUBLIC_DOMAIN}
      # avatars/covers sync convert
      IMAGE_SVC_URL: http://image-svc:8001    
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-8589934592}   # 8 GiB
      ENABLE_STORAGE_PRUNE: ${ENABLE_STORAGE_PRUNE:-false}      # reclaim staged page originals under the cap
      ENABLE_RATE_LIMIT: ${ENABLE_RATE_LIMIT:-false}            # per-IP limiter (all routes + auth/public buckets)
      TRUST_PROXY: ${TRUST_PROXY:-false}                        # key on nginx X-Real-IP (from CF-Connecting-IP)
      JWT_SECRET: ${JWT_SECRET}
      DEFAULT_SUPERUSER_EMAIL: ${DEFAULT_SUPERUSER_EMAIL}
      DEFAULT_SUPERUSER_PASSWORD: ${DEFAULT_SUPERUSER_PASSWORD}
    networks: [default, shared-db]
    mem_limit: 256m
    restart: unless-stopped

  web:
    build:                              # nginx: SPA + proxy /api
      context: ./web
      args:
        VITE_LOGIN_ART_URL: ${VITE_LOGIN_ART_URL:-}
    ports: ["127.0.0.1:8080:80"]        # Cloudflare Tunnel → here
    depends_on: [api]
    mem_limit: 256m
    restart: unless-stopped

networks:
  shared-db:
    external: true
