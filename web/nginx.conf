server {
  listen 80;
  server_name _;

  # Real client IP from Cloudflare (cloudflared is the only upstream; the web port
  # is bound to 127.0.0.1, so CF-Connecting-IP can't be spoofed). Feeds $remote_addr.
  real_ip_header CF-Connecting-IP;
  set_real_ip_from 0.0.0.0/0;

  root /usr/share/nginx/html;
  index index.html;

  # Covers/avatars proxy to /api/v1/upload; match the image service's 10 MB convert cap
  # so legit uploads don't 413. (Page uploads bypass nginx → presigned R2 PUT.)
  client_max_body_size 10m;

  # All versioned API routes → backend. No trailing slash → /api/v1/... is
  # passed through verbatim. Adding modules later needs no nginx change.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Ops health at root (uptime / tunnel checks); unlogged. /metrics is NOT
  # exposed here — it falls through to the SPA, never the public web entrypoint.
  location = /health {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  # Vite assets are content-hashed (new deploy = new filenames), so they are
  # safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback. index.html must revalidate on every load: without an explicit
  # header, browsers/edges heuristically cache it and keep booting the PREVIOUS
  # deploy's bundle (F-059 — fixes "deployed but users still see the old app").
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
