name: build

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web, image-svc, mail-svc]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every service is built per sha, even if unchanged: deploy.sh resolves
      # TAG=$(git rev-parse HEAD), so all four images must exist for every sha.
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          build-args: |
            VITE_LOGIN_ART_URL=${{ vars.VITE_LOGIN_ART_URL }}
          tags: |
            ghcr.io/kohanhq/lazyscan-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/kohanhq/lazyscan-${{ matrix.service }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
